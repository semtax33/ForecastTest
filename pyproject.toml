[project]
name = "energy-nowcast"
version = "3.4.0"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4", "lxml", "numpy", "pandas", "pyarrow", "spacy>=3.8,<4"]

[project.optional-dependencies]
nlp-model = ["en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
